<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dictionnaire</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dico">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232b6cb0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M90 58v72'/%3E%3Cpath d='M90 58c-12-9-28-13-46-13-6 0-10 1-10 1v70s4-1 10-1c18 0 34 4 46 15'/%3E%3Cpath d='M90 58c12-9 28-13 46-13 6 0 10 1 10 1v70s-4-1-10-1c-18 0-34 4-46 15'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232b6cb0'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M90 58v72'/%3E%3Cpath d='M90 58c-12-9-28-13-46-13-6 0-10 1-10 1v70s4-1 10-1c18 0 34 4 46 15'/%3E%3Cpath d='M90 58c12-9 28-13 46-13 6 0 10 1 10 1v70s-4-1-10-1c-18 0-34 4-46 15'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff; --fg:#1c1c1e; --muted:#6b6f76; --line:#e4e6ea; --card:#f7f8fa;
  --accent:#2b6cb0; --accent-bg:#eaf1f9; --contra:#a23b3b; --contra-bg:#fbeded;
  --chip:#eef0f4; --shadow:0 1px 0 rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214; --fg:#e9eaec; --muted:#9aa0a8; --line:#2a2d31; --card:#1a1c1f;
    --accent:#7fb0e8; --accent-bg:#1b2733; --contra:#e59090; --contra-bg:#2e1e1e;
    --chip:#24272b; --shadow:0 1px 0 rgba(255,255,255,.04);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  position:sticky; top:0; z-index:10; background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);
}
.bar{display:flex; gap:8px; align-items:center}
#back{
  flex:0 0 auto; width:44px; height:44px; border:0; border-radius:12px;
  background:var(--chip); color:var(--fg); font-size:20px; line-height:1; cursor:pointer;
  display:none;
}
#back.on{display:block}
form{flex:1 1 auto; display:flex; gap:8px; margin:0}
.field{flex:1 1 auto; min-width:0; position:relative; display:flex}
input[type=search]{
  flex:1 1 auto; min-width:0; height:44px; padding:0 44px 0 14px;
  font-size:17px; color:var(--fg); background:var(--card);
  border:1px solid var(--line); border-radius:12px; -webkit-appearance:none; appearance:none;
}
input[type=search]:focus{outline:none; border-color:var(--accent)}
input[type=search]::-webkit-search-cancel-button{display:none}
.paste{
  position:absolute; right:4px; top:4px; width:36px; height:36px; padding:0;
  border:0; border-radius:10px; background:transparent; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.paste[hidden]{display:none}
.paste:active{color:var(--accent); background:var(--chip)}
.paste:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
button.go{
  flex:0 0 auto; height:44px; padding:0 16px; border:0; border-radius:12px;
  background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer;
}
button.flag{
  flex:0 0 auto; width:44px; height:44px; padding:0; cursor:pointer;
  border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; line-height:1; font-family:inherit; font-weight:600;
}
button.flag:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#menu{
  position:absolute; z-index:20; top:100%; right:16px; margin-top:6px; min-width:190px; padding:6px;
  background:var(--bg); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}
#menu[hidden]{display:none}
#menu button{
  display:flex; align-items:center; gap:10px; width:100%; height:40px; padding:0 10px;
  border:0; border-radius:8px; background:none; color:var(--fg);
  font:inherit; font-size:16px; text-align:left; cursor:pointer;
}
#menu button[aria-current=true]{background:var(--accent-bg); color:var(--accent); font-weight:600}
#menu .fg{font-size:20px; line-height:1; width:24px; text-align:center}
main{max-width:720px; margin:0 auto; padding:16px 16px 64px}

.note{color:var(--muted); font-size:14px; margin:0 0 14px}
.msg{color:var(--muted); text-align:center; padding:48px 12px; font-size:16px}
.msg b{color:var(--fg)}
.msg button{
  display:block; margin:18px auto 0; height:44px; padding:0 20px; border:0; border-radius:12px;
  background:var(--chip); color:var(--fg); font-size:16px; cursor:pointer;
}
.spin{
  width:26px; height:26px; margin:56px auto; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--accent); animation:r .8s linear infinite;
}
@keyframes r{to{transform:rotate(360deg)}}

.entry{margin:0 0 30px}
.entry h1{font:700 30px/1.2 Georgia,"Times New Roman",serif; margin:0 0 4px; letter-spacing:-.01em}
.cat{color:var(--accent); font-size:14px; font-weight:600; margin:0 0 2px}
.orig{color:var(--muted); font-size:14px; font-style:italic; margin:0 0 14px}

ol.senses{list-style:none; margin:0; padding:0; counter-reset:s}
ol.senses>li{
  position:relative; padding:0 0 14px 30px; margin:0 0 14px;
  border-bottom:1px solid var(--line);
}
ol.senses>li:last-child{border-bottom:0}
.num{
  position:absolute; left:0; top:1px; width:22px; text-align:right;
  color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums;
}
.rub{
  display:inline-block; margin:0 0 4px; padding:2px 8px; border-radius:6px;
  background:var(--accent-bg); color:var(--accent);
  font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
}
.def{margin:0}
em.ex{display:block; margin-top:4px; color:var(--muted); font-style:italic}

.syn{margin-top:8px}
.syn .lbl{
  display:block; font-size:12px; font-weight:600; text-transform:uppercase;
  letter-spacing:.04em; color:var(--muted); margin-bottom:4px;
}
.chip{
  display:inline-block; margin:0 6px 6px 0; padding:5px 11px; border:0; border-radius:20px;
  background:var(--chip); color:var(--fg); font-size:15px; font-family:inherit;
}
button.chip{cursor:pointer; background:var(--accent-bg); color:var(--accent); font-weight:500}
.contra button.chip{background:var(--contra-bg); color:var(--contra)}
.indic{display:inline-block; margin:0 6px 6px 0; font-size:13px; color:var(--muted); font-style:italic}
.genre{display:inline-block; margin:0 8px 6px -2px; font-size:13px; color:var(--muted); font-style:italic}

section.trad{padding-bottom:14px; border-bottom:1px solid var(--line)}
section.trad:last-child{padding-bottom:0; border-bottom:0}
section.trad .cat{margin:14px 0 6px}
section.trad .cat:first-of-type{margin-top:0}
.tr{margin:0 0 6px}

button.lien{
  border:0; padding:0; background:none; font:inherit; color:var(--accent);
  cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}

section.blk{margin:0 0 30px}
section.blk>h2{
  font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  color:var(--muted); margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);
}
.loc{margin:0 0 12px}
.loc dt{font-weight:600; margin:0}
.loc dd{margin:2px 0 0; color:var(--muted)}
.homo{margin:0 0 8px; font-size:15px}
.homo .cg{color:var(--muted); font-size:14px}

.hist{margin-top:8px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <button id="back" type="button" aria-label="Retour">&#8592;</button>
    <form id="f">
      <div class="field">
        <input id="q" type="search" name="q" placeholder="Chercher un mot"
               autocapitalize="off" autocorrect="on" autocomplete="on"
               spellcheck="true" enterkeyhint="search">
        <button id="paste" class="paste" type="button" aria-label="Coller" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/>
            <path d="M8 6H6.5A1.5 1.5 0 0 0 5 7.5v11A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 17.5 6H16"/>
          </svg>
        </button>
      </div>
      <button id="lang" class="flag" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <button class="go" type="submit">OK</button>
    </form>
  </div>
  <div id="menu" role="menu" hidden></div>
</header>

<main id="out"></main>

<script>
"use strict";

/* Passer à 'https://api.allorigins.win/raw?url=' si Larousse bloque les requêtes navigateur. */
const PROXY = '';

const BASE = 'https://www.larousse.fr';
const DEF  = BASE + '/dictionnaires/francais/';
const SYN  = BASE + '/dictionnaires/synonymes/';
const EN_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
const TRAD = {
  fr: { url: BASE + '/dictionnaires/francais-anglais/', to: 'en' },
  en: { url: BASE + '/dictionnaires/anglais-francais/', to: 'fr' },
  es: { url: BASE + '/dictionnaires/espagnol-francais/', to: 'fr' }
};
const ES_API = 'https://es.wiktionary.org/w/api.php';

const HIST_MAX  = 15;
const LANG_KEY  = 'dic.lang';

/* Une langue = un drapeau, une source, des textes d'interface. */
const LANGS = {
  fr: {
    flag: '\u{1F1EB}\u{1F1F7}', name: 'Français', code: 'fr', src: 'Larousse',
    t: {
      title:'Dictionnaire', ph:'Chercher un mot', back:'Retour', pick:'Langue', paste:'Coller',
      home:'Un mot, sa définition, ses synonymes.', recent:'Recherches récentes',
      offline: s => 'Pas de réseau, ou ' + s + ' est injoignable.', retry:'Réessayer',
      none: w => 'Aucune entrée pour « ' + w + ' ».',
      syn:'Synonymes et contraires', expr:'Expressions', homo:'Homonymes', trad:'Traduction en anglais',
      synonyms:'Synonymes', antonyms:'Contraires'
    }
  },
  en: {
    flag: '\u{1F1EC}\u{1F1E7}', name: 'English', code: 'en', src: 'DictionaryAPI',
    t: {
      title:'Dictionary', ph:'Search for a word', back:'Back', pick:'Language', paste:'Paste',
      home:'A word, its definition, its synonyms.', recent:'Recent searches',
      offline: s => 'No network, or ' + s + ' is unreachable.', retry:'Retry',
      none: w => 'No entry for “' + w + '”.',
      syn:'Synonyms and antonyms', expr:'Expressions', homo:'Homonyms', trad:'French translation',
      synonyms:'Synonyms', antonyms:'Antonyms'
    }
  },
  es: {
    flag: '\u{1F1EA}\u{1F1F8}', name: 'Español', code: 'es', src: 'Wikcionario',
    t: {
      title:'Diccionario', ph:'Buscar una palabra', back:'Volver', pick:'Idioma', paste:'Pegar',
      home:'Una palabra, su definición, sus sinónimos.', recent:'Búsquedas recientes',
      offline: s => 'Sin red, o ' + s + ' no responde.', retry:'Reintentar',
      none: w => 'No hay entrada para «' + w + '».',
      syn:'Sinónimos y antónimos', expr:'Expresiones', homo:'Homónimos', trad:'Traducción al francés',
      synonyms:'Sinónimos', antonyms:'Antónimos'
    }
  }
};

let lang = 'fr';          /* langue courante */
let word = '';            /* mot affiché, '' sur l'accueil */

const T = () => LANGS[lang].t;

const out     = document.getElementById('out');
const input   = document.getElementById('q');
const back    = document.getElementById('back');
const langBtn = document.getElementById('lang');
const pasteBtn= document.getElementById('paste');
const menu    = document.getElementById('menu');

/* ---------- utilitaires DOM ---------- */

const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const clean = s => (s || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
const cls = n => (typeof n.className === 'string' ? n.className : '');

/* ---------- réseau ---------- */

function target(u) { return PROXY ? PROXY + encodeURIComponent(u) : u; }

async function fetchDoc(u) {
  const r = await fetch(target(u), { credentials: 'omit', redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const html = await r.text();
  return { doc: new DOMParser().parseFromString(html, 'text/html'), url: r.url || u };
}

/* Dernier segment « mot » d'une URL Larousse : /dictionnaires/<dico>/<mot>/<id> */
function wordFromPath(path) {
  try { path = new URL(path, BASE).pathname; } catch (e) { /* déjà un chemin */ }
  const p = path.split('/').filter(Boolean);       // dictionnaires, francais, mot, id
  if (p[0] !== 'dictionnaires' || p.length < 3) return '';
  return clean(decodeURIComponent(p[2]));
}

/* ---------- rendu sûr du HTML tiers (jamais d'innerHTML) ---------- */

/* Éléments décoratifs des pages sources, jamais rendus. */
const SKIP_TAGS  = /^(audio|script|style|img|figure|table|input)$/;
const SKIP_CLASS = /linkaudio|mw-editsection|reference|ext-phonos|mw-file|cite-bracket/;

/* Résolveur « href -> mot cliquable », remplacé par la source active. */
let LINKWORD = wordFromPath;

function inline(src, dst) {
  for (const n of src.childNodes) {
    if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue.replace(/ /g, ' '))); continue; }
    if (n.nodeType !== 1) continue;

    const tag = n.tagName.toLowerCase();
    const c = cls(n);
    if (SKIP_TAGS.test(tag) || SKIP_CLASS.test(c)) continue;

    if (tag === 'a') {
      const w = LINKWORD(n.getAttribute('href') || '');
      if (w) { dst.appendChild(link(clean(n.textContent), w)); continue; }
    }

    let box = dst;
    if (tag === 'i' || tag === 'em') box = dst.appendChild(el('i'));
    else if (tag === 'b' || tag === 'strong') box = dst.appendChild(el('b'));
    else if (tag === 'sup') box = dst.appendChild(el('sup'));
    else if (c.includes('ExempleDefinition')) box = dst.appendChild(el('em', 'ex'));
    inline(n, box);
  }
}

/* Bouton-lien : la ponctuation finale reste du texte, hors de la zone cliquable. */
function link(text, word) {
  const frag = document.createDocumentFragment();
  const m = text.match(/^(.*?)([\s.,;:]*)$/);
  const b = el('button', 'lien', m[1]);
  b.type = 'button';
  b.addEventListener('click', () => go(word));
  frag.appendChild(b);
  if (m[2]) frag.appendChild(document.createTextNode(m[2]));
  return frag;
}

/* ---------- parsing ---------- */

/* « verbe transitif <a>Conjugaison</a> » -> « verbe transitif » */
function catText(node) {
  if (!node) return '';
  const c = node.cloneNode(true);
  c.querySelectorAll('a').forEach(a => a.remove());
  return clean(c.textContent);
}

function parseEntries(doc) {
  const entries = [];
  doc.querySelectorAll('article.BlocDefinition').forEach(art => {
    let cur = null;
    for (const child of art.children) {
      const c = cls(child);
      if (c.includes('Zone-Entree')) {
        cur = {
          head: child.querySelector('.AdresseDefinition'),
          cat:  catText(child.querySelector('.CatgramDefinition')),
          orig: child.querySelector('.OrigineDefinition'),
          senses: []
        };
        entries.push(cur);
      } else if (child.tagName === 'UL' && c.includes('Definitions')) {
        if (!cur) { cur = { head: null, cat: '', orig: null, senses: [] }; entries.push(cur); }
        child.querySelectorAll(':scope > li').forEach(li => cur.senses.push(li));
      }
    }
  });
  return entries;
}

const notFound = doc =>
  !!doc.querySelector('section.corrector') || !doc.querySelector('article.BlocDefinition');

/* ---------- rendu d'un sens ---------- */

/* « alinéa - chapitre - paragraphe » / « chronique, papier. » -> pastilles cliquables */
function renderSynList(p, box) {
  const add = (text, word) => {
    text = clean(text).replace(/^[-–,;]+/, '').replace(/[-–,;.]+$/, '').trim();
    if (!text) return;
    if (word) { const b = el('button', 'chip', text); b.type = 'button'; b.addEventListener('click', () => go(word)); box.appendChild(b); }
    else box.appendChild(el('span', 'chip', text));
  };
  (function walk(node) {
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { n.nodeValue.split(/\s+[-–]\s+|[,;]/).forEach(t => add(t)); continue; }
      if (n.nodeType !== 1) continue;
      if (cls(n).includes('indicateurDefinition')) {
        box.appendChild(el('span', 'indic', clean(n.textContent).replace(/^[-–\s]+/, '')));
        continue;
      }
      if (n.tagName === 'A') { add(n.textContent, wordFromPath(n.getAttribute('href') || '')); continue; }
      walk(n);
    }
  })(p);
}

/* Paires « Synonymes : » / « Contraire : » d'un <li> */
function renderPairs(li, host) {
  const kids = Array.from(li.children);
  kids.forEach((n, i) => {
    if (!cls(n).includes('LibelleSynonyme')) return;
    const list = kids[i + 1];
    if (!list || !cls(list).includes('Synonymes')) return;
    const label = clean(n.textContent);
    const wrap = el('div', 'syn' + (/contraire/i.test(label) ? ' contra' : ''));
    wrap.appendChild(el('span', 'lbl', label.replace(/\s*:\s*$/, '')));
    renderSynList(list, wrap);
    host.appendChild(wrap);
  });
}

function renderSense(li) {
  const item = el('li');

  const num = li.querySelector(':scope > .numDef');
  item.appendChild(el('span', 'num', num ? clean(num.textContent) : '•'));

  const rub = li.querySelector(':scope > .RubriqueDefinition');
  if (rub) item.appendChild(el('span', 'rub', clean(rub.textContent)));

  /* le texte du sens = tout sauf les éléments rendus à part */
  const body = el('p', 'def');
  const skip = ['numDef', 'RubriqueDefinition', 'LibelleSynonyme', 'Synonymes'];
  const src = document.createElement('div');
  for (const n of li.childNodes) {
    if (n.nodeType === 1 && skip.some(k => cls(n).includes(k))) continue;
    src.appendChild(n.cloneNode(true));
  }
  inline(src, body);
  if (clean(body.textContent)) item.appendChild(body);

  renderPairs(li, item);
  return item;
}

/* ---------- rendu de la page ---------- */

function renderEntry(e) {
  const box = el('article', 'entry');

  const h1 = el('h1');
  if (e.head) inline(e.head, h1);
  if (clean(h1.textContent)) box.appendChild(h1);

  if (e.cat) box.appendChild(el('p', 'cat', e.cat));
  if (e.orig) { const o = el('p', 'orig'); inline(e.orig, o); box.appendChild(o); }

  const list = el('ol', 'senses');
  e.senses.forEach(li => list.appendChild(renderSense(li)));
  box.appendChild(list);
  return box;
}

function renderSynDoc(doc) {
  const entries = parseEntries(doc);
  const rows = [];
  entries.forEach(e => e.senses.forEach(li => {
    const gloss = el('dt');
    const src = document.createElement('div');
    for (const n of li.childNodes) {
      if (n.nodeType === 1 && ['numDef', 'LibelleSynonyme', 'Synonymes'].some(k => cls(n).includes(k))) continue;
      src.appendChild(n.cloneNode(true));
    }
    inline(src, gloss);
    const wrap = el('dl', 'loc');
    if (clean(gloss.textContent)) wrap.appendChild(gloss);
    const pairs = el('div');
    renderPairs(li, pairs);
    if (!pairs.childNodes.length) return;
    wrap.appendChild(pairs);
    rows.push(wrap);
  }));
  if (!rows.length) return null;

  const sec = el('section', 'blk');
  sec.appendChild(el('h2', null, T().syn));
  rows.forEach(r => sec.appendChild(r));
  return sec;
}

function renderLocutions(doc) {
  const items = doc.querySelectorAll('article.BlocLocutions li.Locution');
  if (!items.length) return null;
  const sec = el('section', 'blk');
  sec.appendChild(el('h2', null, T().expr));
  items.forEach(li => {
    const dl = el('dl', 'loc');
    const dt = el('dt'), dd = el('dd');
    const a = li.querySelector('.AdresseLocution');
    const t = li.querySelector('.TexteLocution');
    if (a) { inline(a, dt); dt.textContent = clean(dt.textContent).replace(/,\s*$/, ''); }
    if (t) inline(t, dd);
    dl.appendChild(dt); dl.appendChild(dd);
    sec.appendChild(dl);
  });
  return sec;
}

function renderHomonymes(doc) {
  const items = doc.querySelectorAll('article.Blochomonymes li.Homonyme');
  if (!items.length) return null;
  const sec = el('section', 'blk');
  sec.appendChild(el('h2', null, T().homo));
  items.forEach(li => {
    const p = el('p', 'homo');
    const cg = li.querySelector('.CatGramHomonyme');
    const src = document.createElement('div');
    for (const n of li.childNodes) {
      if (n === cg) continue;
      src.appendChild(n.cloneNode(true));
    }
    inline(src, p);
    if (cg) { const s = el('span', 'cg'); inline(cg, s); p.appendChild(document.createTextNode(' ')); p.appendChild(s); }
    sec.appendChild(p);
  });
  return sec;
}

/* ---------- source française : Larousse ---------- */

async function frFetch(w) {
  const trad = fetchTrad('fr', w);                 /* en parallèle de la définition */
  const main = await fetchDoc(DEF + encodeURIComponent(w));

  const sec = renderTrad(await trad, w, TRAD.fr.to);
  const missing = notFound(main.doc);
  /* la traduction seule vaut mieux qu'une page d'erreur */
  if (missing && !sec) return null;

  const lemma = (!missing && wordFromPath(main.url)) || w;
  let synBox = null;

  return {
    lemma,
    render(box) {
      if (sec) box.appendChild(sec);
      if (missing) return;
      LINKWORD = wordFromPath;
      parseEntries(main.doc).forEach(e => box.appendChild(renderEntry(e)));

      /* les synonymes arrivent après : ils ne doivent pas retarder les définitions */
      synBox = el('div');
      box.appendChild(synBox);

      const loc = renderLocutions(main.doc); if (loc) box.appendChild(loc);
      const hom = renderHomonymes(main.doc); if (hom) box.appendChild(hom);
    },
    async more(alive) {
      if (!synBox) return;                         /* pas de définition : rien à compléter */
      try {
        let syn = await fetchDoc(SYN + encodeURIComponent(w));
        if (notFound(syn.doc) && lemma !== w) syn = await fetchDoc(SYN + encodeURIComponent(lemma));
        if (!alive() || notFound(syn.doc)) return;
        LINKWORD = wordFromPath;
        const sec = renderSynDoc(syn.doc);
        if (sec) synBox.appendChild(sec);
      } catch (e) { /* non bloquant : les synonymes par sens sont déjà affichés */ }
    }
  };
}

/* ---------- traduction française : Larousse bilingue ---------- */

/* Jamais rejetée : sans traduction, la définition s'affiche seule. */
function fetchTrad(l, w) {
  return fetchDoc(TRAD[l].url + encodeURIComponent(w)).then(r => r.doc, () => null);
}

/* « <a>maison</a> <span class=Genre>f</span> » -> pastille + genre */
function tradChip(tr, host, to) {
  const c = tr.cloneNode(true);
  c.querySelectorAll('.Genre, .Metalangue2, .FormeFlechieTraduction, audio, [class*=lienson], [class*=lienconj]')
   .forEach(n => n.remove());
  const text = clean(c.textContent).replace(/[,;]+$/, '');
  if (!text) return;

  const a = c.querySelector('a');
  const w = a ? wordFromPath(a.getAttribute('href') || '') : '';
  if (w && clean(a.textContent).replace(/[,;]+$/, '') === text) {
    const b = el('button', 'chip', text);
    b.type = 'button';
    b.addEventListener('click', () => goIn(to, w));   /* la traduction ouvre l'article correspondant */
    host.appendChild(b);
  } else {
    host.appendChild(el('span', 'chip', text));
  }

  const add = (sel, klass) => {
    const n = tr.querySelector(sel);
    const txt = n ? clean(n.textContent).replace(/[,;]+$/, '') : '';
    if (txt) host.appendChild(el('span', klass, txt));
  };
  add('.Genre', 'genre');          /* maison f */
  add('.Metalangue2', 'indic');    /* lorry (UK) */
}

/* Un sens : indicateurs de domaine ou d'emploi, puis les traductions. */
function tradSense(li, host, to) {
  const src = li.cloneNode(true);
  src.querySelectorAll('.ZoneExpression').forEach(n => n.remove());   /* expressions : déjà dans les définitions */

  /* un indicateur n'est gardé que s'il annonce une traduction : les sous-sens
     dont tout le contenu tenait dans les expressions retirées laissent une étiquette seule */
  const line = el('p', 'tr');
  let pending = [];
  src.querySelectorAll('.Indicateur, .IndicateurDomaine, .Metalangue, .Traduction').forEach(n => {
    if (cls(n).includes('Traduction')) {
      pending.forEach(p => line.appendChild(p));
      pending = [];
      tradChip(n, line, to);
      return;
    }
    const txt = clean(n.textContent);
    if (txt) pending.push(el('span', 'indic', txt));
  });
  /* « (très familier) » porté à la fois par le sens et par chaque traduction */
  const seen = new Set();
  Array.from(line.querySelectorAll('.indic')).forEach(n => {
    if (seen.has(n.textContent)) n.remove(); else seen.add(n.textContent);
  });

  if (line.querySelector('.chip')) host.appendChild(line);
}

function renderTrad(doc, w, to) {
  if (!doc) return null;

  const zones = Array.from(doc.querySelectorAll('.article_bilingue .ZoneEntree'));
  const same = z => {
    const a = z.querySelector('.Adresse');
    return a && clean(a.textContent).toLowerCase() === w.toLowerCase();
  };
  /* « book in », « books » : entrées voisines, écartées si le mot cherché a les siennes */
  const kept = zones.some(same) ? zones.filter(same) : zones;

  const sec = el('section', 'blk trad');
  sec.appendChild(el('h2', null, T().trad));

  kept.forEach(zone => {
    const texte = zone.nextElementSibling;
    if (!texte || !cls(texte).includes('ZoneTexte')) return;
    const senses = texte.querySelectorAll('li.itemZONESEM');
    const box = el('div');
    /* une entrée à sens unique n'a pas de liste : les traductions pendent de la zone */
    if (senses.length) senses.forEach(li => tradSense(li, box, to));
    else tradSense(texte, box, to);
    if (!box.childNodes.length) return;

    const cat = catText(zone.querySelector('.CategorieGrammaticale'));
    if (cat) sec.appendChild(el('p', 'cat', cat));
    while (box.firstChild) sec.appendChild(box.firstChild);
  });

  return sec.querySelector('.tr') ? sec : null;
}

/* ---------- source anglaise : dictionaryapi.dev (JSON) ---------- */

function enChips(words, label, host) {
  const list = (words || []).filter(Boolean);
  if (!list.length) return;
  const wrap = el('div', 'syn' + (label === T().antonyms ? ' contra' : ''));
  wrap.appendChild(el('span', 'lbl', label));
  list.forEach(w => {
    const b = el('button', 'chip', w);
    b.type = 'button';
    b.addEventListener('click', () => go(w));
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
}

function enEntry(e) {
  const box = el('article', 'entry');
  box.appendChild(el('h1', null, e.word));

  const phon = e.phonetic || (e.phonetics || []).map(p => p.text).filter(Boolean)[0];
  if (phon) box.appendChild(el('p', 'orig', phon));

  (e.meanings || []).forEach(m => {
    if (m.partOfSpeech) box.appendChild(el('p', 'cat', m.partOfSpeech));

    const list = el('ol', 'senses');
    (m.definitions || []).forEach((d, i) => {
      if (!d.definition) return;
      const item = el('li');
      item.appendChild(el('span', 'num', String(i + 1)));
      item.appendChild(el('p', 'def', d.definition));
      if (d.example) item.appendChild(el('em', 'ex', d.example));
      enChips(d.synonyms, T().synonyms, item);
      enChips(d.antonyms, T().antonyms, item);
      list.appendChild(item);
    });
    if (list.childNodes.length) box.appendChild(list);

    const extra = el('div');
    enChips(m.synonyms, T().synonyms, extra);
    enChips(m.antonyms, T().antonyms, extra);
    if (extra.childNodes.length) box.appendChild(extra);
  });
  return box;
}

async function enFetch(w) {
  const trad = fetchTrad('en', w);                 /* en parallèle de la définition */

  let data = null, down = false;
  try {
    const r = await fetch(EN_API + encodeURIComponent(w), { credentials: 'omit' });
    if (r.ok) data = await r.json();
    else if (r.status !== 404) down = true;        /* l'API rend 502 sur certains mots */
  } catch (e) { down = true; }

  const entries = Array.isArray(data) ? data : [];
  const sec = renderTrad(await trad, w, TRAD.en.to);
  /* la traduction seule vaut mieux qu'une page d'erreur */
  if (!entries.length && !sec) { if (down) throw new Error('source indisponible'); return null; }

  return {
    lemma: clean((entries[0] || {}).word) || w,
    render(box) {
      if (sec) box.appendChild(sec);
      entries.forEach(e => box.appendChild(enEntry(e)));
    }
  };
}

/* ---------- source espagnole : es.wiktionary (HTML) ---------- */

/* Rubriques du wiktionnaire qui ne portent pas de définitions. */
const ES_META = /^(traducc|v[eé]ase|informaci|referenc|conjugaci|anagram|similar|nota|derivad|compuest|pronunciaci|forma flexiva|hiper|hip[oó]|mer[oó]|hol[oó]|relacionad|ant[oó]|sin[oó]|cita|descend|abreviatur|categor)/;

/* /wiki/mot#Español -> « mot » ; liens rouges, externes et espaces de noms exclus. */
function esWordFromHref(href) {
  if (!/^\/wiki\//.test(href || '')) return '';
  let w = href.slice(6).split('#')[0];
  try { w = decodeURIComponent(w); } catch (e) { /* déjà décodé */ }
  w = clean(w.replace(/_/g, ' '));
  return w.includes(':') ? '' : w;
}

function esHeading(node) {
  if (/^H[2-6]$/.test(node.tagName)) return node;
  return cls(node).includes('mw-heading') ? node.querySelector('h2,h3,h4,h5,h6') : null;
}

function esText(node) {
  const c = node.cloneNode(true);
  c.querySelectorAll('.mw-editsection').forEach(n => n.remove());
  return clean(c.textContent);
}

/* Les définitions d'un <dl> : <dt>3 Rubrique</dt><dd>sens + précisions</dd> */
function esSenses(dl, entry) {
  let sense = null;
  for (const kid of dl.children) {
    if (kid.tagName === 'DT') {
      const m = esText(kid).match(/^(\d+)\s*(.*)$/);
      sense = { num: m ? m[1] : '', rub: m ? m[2] : esText(kid), bodies: [], items: [] };
      entry.senses.push(sense);
      continue;
    }
    if (kid.tagName !== 'DD') continue;

    if (!sense) {                                   /* <dd> isolé : suite du sens précédent */
      sense = entry.senses[entry.senses.length - 1];
      if (!sense) { sense = { num: '', rub: '', bodies: [], items: [] }; entry.senses.push(sense); }
    }
    const lists = Array.from(kid.querySelectorAll(':scope > ul'));
    const body = document.createElement('div');
    for (const n of kid.childNodes) {
      if (lists.includes(n)) continue;
      body.appendChild(n.cloneNode(true));
    }
    if (clean(body.textContent)) sense.bodies.push(body);
    lists.forEach(ul => ul.querySelectorAll(':scope > li').forEach(li => sense.items.push(li)));
  }
}

function esParse(doc) {
  const root = doc.querySelector('.mw-parser-output');
  if (!root) return null;

  const entries = [], blocks = [];
  let inEs = false, mode = null, cur = null, ety = null;

  for (const node of root.children) {
    const h = esHeading(node);
    if (h) {
      const text = esText(h);
      if (h.tagName === 'H2') { inEs = /^español$/i.test(text); mode = null; cur = null; ety = null; continue; }
      if (!inEs) continue;

      const key = text.toLowerCase().replace(/\s*\d+$/, '').trim();
      cur = null;
      if (/^etimolog/.test(key))                     { mode = 'ety'; ety = null; continue; }
      if (/^(locucion|refran|expresion|frases)/.test(key)) { mode = 'loc'; blocks.push({ title: text, items: [] }); continue; }
      if (ES_META.test(key))                         { mode = null; continue; }

      cur = { cat: text, head: null, ety, senses: [] };
      entries.push(cur);
      mode = 'entry';
      continue;
    }
    if (!inEs) continue;

    if (mode === 'ety') { if (!ety && node.tagName === 'P') ety = node; continue; }
    if (mode === 'loc') { const b = blocks[blocks.length - 1]; node.querySelectorAll('li').forEach(li => b.items.push(li)); continue; }
    if (mode !== 'entry' || !cur) continue;

    if (node.tagName === 'P' && !cur.head && !cur.senses.length) { cur.head = node; continue; }
    if (node.tagName === 'DL') esSenses(node, cur);
  }

  const kept = entries.filter(e => e.senses.length);
  if (!kept.length) return null;
  return { entries: kept, blocks: blocks.filter(b => b.items.length) };
}

/* « Sinónimos: a, b, c. » -> pastilles ; « Ejemplo: … » -> ligne en italique. */
function esItem(li, host) {
  const lbl = li.querySelector(':scope > b');
  const label = lbl ? esText(lbl).replace(/\s*:\s*$/, '') : '';

  const rest = document.createElement('div');
  for (const n of li.childNodes) {
    if (n === lbl) continue;
    rest.appendChild(n.cloneNode(true));
  }

  const links = rest.querySelectorAll('a');
  if (label && links.length && /^(sin[oó]nimo|ant[oó]nimo|hip[eoó]|mer[oó]|hol[oó]|relacionad|derivad|coordinad)/i.test(label)) {
    const wrap = el('div', 'syn' + (/^ant[oó]/i.test(label) ? ' contra' : ''));
    wrap.appendChild(el('span', 'lbl', label));
    links.forEach(a => {
      const txt = clean(a.textContent).replace(/[.,;]+$/, '');
      if (!txt) return;
      const w = esWordFromHref(a.getAttribute('href') || '');
      if (!w) { wrap.appendChild(el('span', 'chip', txt)); return; }
      const b = el('button', 'chip', txt);
      b.type = 'button';
      b.addEventListener('click', () => go(w));
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
    return;
  }

  const line = el('em', 'ex');
  if (lbl) line.appendChild(el('b', null, esText(lbl) + ' '));
  inline(rest, line);
  if (clean(line.textContent)) host.appendChild(line);
}

function esSense(sense) {
  const item = el('li');
  item.appendChild(el('span', 'num', sense.num || '•'));
  if (sense.rub) item.appendChild(el('span', 'rub', sense.rub));
  sense.bodies.forEach(b => {
    const p = el('p', 'def');
    inline(b, p);
    if (clean(p.textContent)) item.appendChild(p);
  });
  sense.items.forEach(li => esItem(li, item));
  return item;
}

function esEntry(e, title) {
  const box = el('article', 'entry');
  box.appendChild(el('h1', null, title));
  box.appendChild(el('p', 'cat', e.cat));

  if (e.head) { const p = el('p', 'orig'); inline(e.head, p); if (clean(p.textContent)) box.appendChild(p); }
  if (e.ety)  { const p = el('p', 'orig'); inline(e.ety, p);  if (clean(p.textContent)) box.appendChild(p); }

  const list = el('ol', 'senses');
  e.senses.forEach(sense => list.appendChild(esSense(sense)));
  box.appendChild(list);
  return box;
}

/* « perro bravo: perro de carácter agresivo. » -> terme + glose */
function esLocutions(block) {
  const sec = el('section', 'blk');
  sec.appendChild(el('h2', null, block.title));
  block.items.forEach(li => {
    const dt = el('dt'), dd = el('dd');
    let target = dt;
    for (const n of li.childNodes) {
      if (target === dt && n.nodeType === 3 && n.nodeValue.includes(':')) {
        const cut = n.nodeValue.indexOf(':');
        dt.appendChild(document.createTextNode(n.nodeValue.slice(0, cut)));
        target = dd;
        dd.appendChild(document.createTextNode(n.nodeValue.slice(cut + 1)));
        continue;
      }
      const holder = document.createElement('div');
      holder.appendChild(n.cloneNode(true));
      inline(holder, target);
    }
    dt.textContent = clean(dt.textContent);
    if (!dt.textContent) return;
    const dl = el('dl', 'loc');
    dl.appendChild(dt);
    if (clean(dd.textContent)) { dd.textContent = clean(dd.textContent); dl.appendChild(dd); }
    sec.appendChild(dl);
  });
  return sec.querySelectorAll('dl').length ? sec : null;
}

async function esPage(w) {
  const q = '?action=parse&prop=text&formatversion=2&format=json&origin=*&redirects=1&page=';
  const r = await fetch(ES_API + q + encodeURIComponent(w), { credentials: 'omit' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  return data.error ? null : data.parse;      /* missingtitle : page absente */
}

async function esFetch(w) {
  const trad = fetchTrad('es', w);                 /* en parallèle de la définition */

  /* le wiktionnaire distingue la casse : « Casa » n'existe pas, « casa » oui */
  const low = w.toLocaleLowerCase('es');
  const cap = low.charAt(0).toLocaleUpperCase('es') + low.slice(1);
  const tries = [];
  [w, low, cap].forEach(v => { if (v && !tries.includes(v)) tries.push(v); });

  let parsed = null, lemma = w, down = false;
  try {
    for (const v of tries) {
      const page = await esPage(v);
      if (!page) continue;
      parsed = esParse(new DOMParser().parseFromString(page.text, 'text/html'));
      if (parsed) { lemma = clean(page.title) || v; break; }
    }
  } catch (e) { down = true; }

  const sec = renderTrad(await trad, w, TRAD.es.to);
  /* la traduction seule vaut mieux qu'une page d'erreur */
  if (!parsed && !sec) { if (down) throw new Error('source indisponible'); return null; }

  return {
    lemma,
    render(box) {
      if (sec) box.appendChild(sec);
      if (!parsed) return;
      LINKWORD = esWordFromHref;
      parsed.entries.forEach(e => box.appendChild(esEntry(e, lemma)));
      parsed.blocks.forEach(b => {
        const bloc = esLocutions(b);
        if (bloc) box.appendChild(bloc);
      });
    }
  };
}

const SOURCES = { fr: frFetch, en: enFetch, es: esFetch };

/* ---------- historique ---------- */

const histKey = () => 'dic.hist.' + lang;

(function migrate() {                            /* ancien historique, français */
  try {
    const old = localStorage.getItem('dic.hist');
    if (old && !localStorage.getItem('dic.hist.fr')) localStorage.setItem('dic.hist.fr', old);
    if (old) localStorage.removeItem('dic.hist');
  } catch (e) {}
})();

const readHist = () => { try { return JSON.parse(localStorage.getItem(histKey())) || []; } catch (e) { return []; } };
function pushHist(w) {
  const h = readHist().filter(x => x !== w);
  h.unshift(w);
  try { localStorage.setItem(histKey(), JSON.stringify(h.slice(0, HIST_MAX))); } catch (e) {}
}

function renderHome() {
  out.textContent = '';
  const h = readHist();
  const msg = el('div', 'msg');
  msg.appendChild(el('p', null, T().home));
  out.appendChild(msg);
  if (!h.length) return;
  const sec = el('section', 'blk hist');
  sec.appendChild(el('h2', null, T().recent));
  h.forEach(w => {
    const b = el('button', 'chip', w);
    b.type = 'button';
    b.addEventListener('click', () => go(w));
    sec.appendChild(b);
  });
  out.appendChild(sec);
}

/* ---------- recherche ---------- */

let seq = 0;

function message(nodes) {
  out.textContent = '';
  const m = el('div', 'msg');
  nodes.forEach(n => m.appendChild(n));
  out.appendChild(m);
}

async function show(w) {
  const my = ++seq;
  word = w;
  input.value = w;
  input.blur();
  out.textContent = '';
  out.appendChild(el('div', 'spin'));
  window.scrollTo(0, 0);

  const asked = lang;
  let res;
  try {
    res = await SOURCES[asked](w);
  } catch (e) {
    if (my !== seq) return;
    const b = el('button', null, T().retry);
    b.type = 'button';
    b.addEventListener('click', () => show(w));
    message([el('p', null, T().offline(LANGS[asked].src)), b]);
    return;
  }
  if (my !== seq) return;

  if (!res) { message([el('p', null, T().none(w))]); return; }

  pushHist(res.lemma);
  out.textContent = '';
  if (res.lemma.toLowerCase() !== w.toLowerCase()) {
    out.appendChild(el('p', 'note', w + ' → ' + res.lemma));
  }
  res.render(out);
  if (res.more) res.more(() => my === seq);
}

function go(w) {
  w = clean(w);
  if (!w) return;
  history.pushState({ m: w, l: lang }, '', '#' + lang + '/' + encodeURIComponent(w));
  back.classList.add('on');
  show(w);
}

/* Suivre un mot dans une autre langue : une traduction ouvre le dictionnaire français. */
function goIn(l, w) {
  if (l !== lang) setLang(l, false);
  go(w);
}

/* ---------- langue ---------- */

function setLang(code, navigate) {
  lang = LANGS[code] ? code : 'fr';
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}

  const L = LANGS[lang];
  document.documentElement.lang = L.code;
  document.title = L.t.title;
  input.placeholder = L.t.ph;
  back.setAttribute('aria-label', L.t.back);
  langBtn.textContent = L.flag;
  langBtn.setAttribute('aria-label', L.t.pick + ' : ' + L.name);
  pasteBtn.setAttribute('aria-label', L.t.paste);
  pasteBtn.title = L.t.paste;
  Array.from(menu.children).forEach(b => b.setAttribute('aria-current', b.dataset.l === lang ? 'true' : 'false'));

  if (!navigate) return;
  if (word) go(word); else { seq++; renderHome(); }
}

function openMenu(on) {
  menu.hidden = !on;
  langBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
}

Object.keys(LANGS).forEach(code => {
  const b = el('button');
  b.type = 'button';
  b.dataset.l = code;
  b.setAttribute('role', 'menuitemradio');
  b.appendChild(el('span', 'fg', LANGS[code].flag));
  b.appendChild(el('span', null, LANGS[code].name));
  b.addEventListener('click', () => { openMenu(false); langBtn.focus(); setLang(code, true); });
  menu.appendChild(b);
});

langBtn.addEventListener('click', ev => { ev.stopPropagation(); openMenu(menu.hidden); });
document.addEventListener('click', ev => { if (!menu.hidden && !menu.contains(ev.target)) openMenu(false); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') openMenu(false); });

/* ---------- navigation ---------- */

/* #es/casa : langue + mot ; #casa : ancien format, langue courante */
function readHash() {
  const raw = location.hash.slice(1);
  const dec = v => { try { return clean(decodeURIComponent(v)); } catch (e) { return clean(v); } };
  const cut = raw.indexOf('/');
  const head = cut > 0 ? raw.slice(0, cut) : '';
  return LANGS[head] ? { lang: head, word: dec(raw.slice(cut + 1)) } : { lang: null, word: dec(raw) };
}

/* Coller : le presse-papiers n'est lisible que sur geste de l'utilisateur. */
if (navigator.clipboard && navigator.clipboard.readText) {
  pasteBtn.hidden = false;
  pasteBtn.addEventListener('click', async () => {
    let txt = '';
    try { txt = await navigator.clipboard.readText(); } catch (e) { txt = ''; }
    txt = clean(txt).slice(0, 80);
    if (!txt) { input.focus(); input.select(); return; }
    input.value = txt;
    go(txt);
  });
}

document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  go(input.value);
});

back.addEventListener('click', () => history.back());

window.addEventListener('popstate', () => {
  const h = readHash();
  if (h.lang && h.lang !== lang) setLang(h.lang, false);
  if (h.word) { show(h.word); } else { seq++; word = ''; input.value = ''; renderHome(); }
  back.classList.toggle('on', !!h.word);
});

(function start() {
  let saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
  const h = readHash();
  setLang(h.lang || saved || 'fr', false);
  if (h.word) { back.classList.add('on'); show(h.word); }
  else renderHome();
})();
</script>
</body>
