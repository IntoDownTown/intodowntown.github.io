<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Buzzer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#c8322d" id="tint">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buzzer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23191b1f'/%3E%3Crect x='28' y='106' width='124' height='34' rx='17' fill='%23f2c230'/%3E%3Ccircle cx='90' cy='84' r='46' fill='%23e0453f'/%3E%3Ccircle cx='74' cy='68' r='14' fill='%23fff' opacity='.35'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23191b1f'/%3E%3Crect x='28' y='106' width='124' height='34' rx='17' fill='%23f2c230'/%3E%3Ccircle cx='90' cy='84' r='46' fill='%23e0453f'/%3E%3Ccircle cx='74' cy='68' r='14' fill='%23fff' opacity='.35'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --fg:#1c1c1e; --muted:#6b6f76; --line:#e0e2e6; --card:#fff;
  --team:#d33a34; --team-lo:#8f1f1b; --team-hi:#f0736c; --team-soft:#fbeceb;
  --shadow:0 1px 2px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214; --fg:#e9eaec; --muted:#9aa0a8; --line:#2a2d31; --card:#1a1c1f;
    --team-soft:#2c1917; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
body.yellow{
  --team:#e7b220; --team-lo:#9a6f06; --team-hi:#ffd764; --team-soft:#fbf3dd;
}
@media (prefers-color-scheme:dark){ body.yellow{ --team-soft:#2b2413; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--fg);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; align-items:center;
  gap:clamp(20px,5vh,44px);
  padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 16px);
  overflow:hidden; user-select:none; -webkit-user-select:none;
  transition:background .25s;
}

/* ---- team switch ---- */
.teams{
  display:flex; gap:6px; padding:5px; border-radius:16px;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
}
.team{
  display:flex; align-items:center; gap:9px;
  min-height:46px; padding:0 20px; border:0; border-radius:12px;
  background:transparent; color:var(--muted); cursor:pointer;
  font:inherit; font-weight:600; font-size:16px; letter-spacing:.01em;
  transition:background .18s,color .18s;
}
.team .dot{
  width:15px; height:15px; border-radius:50%; flex:0 0 auto;
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);
}
.team[data-t=red] .dot{background:#d33a34}
.team[data-t=yellow] .dot{background:#e7b220}
.team[aria-checked=true]{color:#fff}
.team[data-t=red][aria-checked=true]{background:#d33a34}
.team[data-t=yellow][aria-checked=true]{background:#e7b220;color:#3a2b00}
.team[aria-checked=true] .dot{background:rgba(255,255,255,.9)}
.team:focus-visible{outline:2px solid var(--fg); outline-offset:2px}

/* ---- buzzer ---- */
.stage{
  flex:1 1 auto; display:flex; align-items:center; justify-content:center;
  width:100%; min-height:0; position:relative;
}
.buzzer{
  --size:min(74vw,44vh,340px);
  position:relative; z-index:1;
  width:var(--size); height:var(--size);
  border:0; border-radius:50%; padding:0; cursor:pointer;
  color:#fff; font:inherit; font-weight:800; letter-spacing:.14em;
  font-size:clamp(22px,7vw,38px); text-transform:uppercase;
  text-shadow:0 2px 4px rgba(0,0,0,.3);
  background:
    radial-gradient(circle at 34% 26%, var(--team-hi), var(--team) 52%, var(--team-lo) 100%);
  box-shadow:
    inset 0 -10px 22px rgba(0,0,0,.28),
    inset 0 8px 18px rgba(255,255,255,.28),
    0 14px 0 var(--team-lo),
    0 22px 34px rgba(0,0,0,.32);
  transition:transform .07s ease-out, box-shadow .07s ease-out, background .25s;
  touch-action:manipulation;
}
.buzzer::after{
  content:""; position:absolute; left:16%; top:11%; width:38%; height:24%;
  border-radius:50%; background:rgba(255,255,255,.34); filter:blur(6px); pointer-events:none;
}
body.yellow .buzzer{color:#4a3400; text-shadow:0 1px 2px rgba(255,255,255,.45)}
.buzzer.down{
  transform:translateY(11px);
  box-shadow:
    inset 0 -6px 16px rgba(0,0,0,.34),
    inset 0 6px 14px rgba(255,255,255,.2),
    0 3px 0 var(--team-lo),
    0 8px 16px rgba(0,0,0,.3);
}
.buzzer:focus-visible{outline:3px solid var(--fg); outline-offset:8px}
.ring{
  position:absolute; left:50%; top:50%; width:min(74vw,44vh,340px); aspect-ratio:1;
  margin:-1px 0 0 -1px; translate:-50% -50%;
  border-radius:50%; border:3px solid var(--team); opacity:0; pointer-events:none;
}
.ring.go{animation:pop .55s ease-out}
@keyframes pop{
  from{opacity:.6; scale:1}
  to{opacity:0; scale:1.55}
}
@media (prefers-reduced-motion:reduce){
  .ring.go{animation:none}
  .buzzer{transition:none}
}

.hint{
  margin:0; min-height:1.5em; color:var(--muted); font-size:14px; text-align:center;
}
.hint b{color:var(--team); font-weight:700}
</style>
</head>
<body class="red">

<div class="teams" role="radiogroup" aria-label="Équipe">
  <button class="team" data-t="red" role="radio" aria-checked="true"><span class="dot"></span>Rouge</button>
  <button class="team" data-t="yellow" role="radio" aria-checked="false"><span class="dot"></span>Jaune</button>
</div>

<div class="stage">
  <span class="ring" id="ring"></span>
  <button class="buzzer" id="buzz" aria-label="Buzzer">Buzz</button>
</div>

<p class="hint" id="hint">Appuie sur le bouton ou la barre d’espace</p>

<script>
(function(){
  var body=document.body, buzz=document.getElementById('buzz'), ring=document.getElementById('ring');
  var hint=document.getElementById('hint'), tint=document.getElementById('tint');
  var teams=[].slice.call(document.querySelectorAll('.team'));
  var TINT={red:'#c8322d',yellow:'#d9a417'};
  var NAME={red:'Rouge',yellow:'Jaune'};
  var DUR={red:.55,yellow:.7};
  var team='red', count=0, ac=null, warned=false;
  var pool={red:[],yellow:[]}, turn={red:0,yellow:0};

  /* iOS 16.4+ : quitter la catégorie "ambient", sinon le petit bouton
     silence du téléphone coupe tout le son de la page. */
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

  /* ---------- synthèse ---------- */
  function noise(a,t,dur,freq,vol,dest){          // court souffle d'attaque
    var n=Math.max(1,Math.floor(a.sampleRate*dur));
    var b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var s=a.createBufferSource(); s.buffer=b;
    var f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=freq;
    var g=a.createGain(); g.gain.value=vol;
    s.connect(f).connect(g).connect(dest); s.start(t);
  }

  /* Rouge : klaxon de clown, deux notes bien grasses qui retombent */
  function honk(a,t,dest){
    var out=a.createGain(); out.connect(dest);
    out.gain.setValueAtTime(.0001,t);
    out.gain.exponentialRampToValueAtTime(.5,t+.014);
    out.gain.setValueAtTime(.5,t+.30);
    out.gain.exponentialRampToValueAtTime(.0001,t+.46);

    var lp=a.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(2800,t);
    lp.frequency.linearRampToValueAtTime(1500,t+.46);
    lp.Q.value=.8; lp.connect(out);

    var vib=a.createOscillator(); vib.type='sine'; vib.frequency.value=5.5;
    var vibg=a.createGain(); vibg.gain.value=5;
    vib.connect(vibg); vib.start(t); vib.stop(t+.5);

    [[392,.5],[523.25,.34]].forEach(function(p){
      var f=p[0];
      var o=a.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(f*.9,t);
      o.frequency.exponentialRampToValueAtTime(f,t+.045);
      o.frequency.setValueAtTime(f,t+.29);
      o.frequency.exponentialRampToValueAtTime(f*.84,t+.46);
      vibg.connect(o.frequency);
      var g=a.createGain(); g.gain.value=p[1];
      o.connect(g).connect(lp); o.start(t); o.stop(t+.5);
    });
    noise(a,t,.05,1200,.12,out);
  }

  /* Jaune : boing de dessin animé, ressort qui frétille */
  function boing(a,t,dest){
    var out=a.createGain(); out.connect(dest);
    out.gain.setValueAtTime(.0001,t);
    out.gain.exponentialRampToValueAtTime(.55,t+.008);
    out.gain.exponentialRampToValueAtTime(.0001,t+.62);

    var o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(900,t);
    o.frequency.exponentialRampToValueAtTime(170,t+.52);

    var lfo=a.createOscillator(); lfo.type='sine';
    lfo.frequency.setValueAtTime(18,t);
    lfo.frequency.exponentialRampToValueAtTime(7,t+.55);
    var dep=a.createGain();
    dep.gain.setValueAtTime(320,t);
    dep.gain.exponentialRampToValueAtTime(6,t+.58);
    lfo.connect(dep).connect(o.frequency);

    o.connect(out); o.start(t); o.stop(t+.65);
    lfo.start(t); lfo.stop(t+.65);
    noise(a,t,.04,2200,.09,out);
  }

  var VOICE={red:honk,yellow:boing};

  /* ---------- pré-rendu en fichiers WAV ----------
     Sur iPhone, WebAudio joue en catégorie « ambient » et se fait donc
     couper par le bouton silence, y compris dans l'appli installée.
     Une balise <audio>, elle, passe en catégorie lecture : on synthétise
     donc les deux sons une fois au chargement et on les rejoue comme des
     fichiers. WebAudio reste en secours si le pré-rendu échoue. */
  function wav(buf){
    var d=buf.getChannelData(0), n=d.length, sr=buf.sampleRate;
    var ab=new ArrayBuffer(44+n*2), v=new DataView(ab), i;
    function tag(o,str){ for(var j=0;j<str.length;j++) v.setUint8(o+j,str.charCodeAt(j)); }
    tag(0,'RIFF');  v.setUint32(4,36+n*2,true);
    tag(8,'WAVE');  tag(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);  v.setUint16(34,16,true);
    tag(36,'data'); v.setUint32(40,n*2,true);
    for(i=0;i<n;i++){
      var x=d[i]; x=x<-1?-1:x>1?1:x;
      v.setInt16(44+i*2, x<0?x*0x8000:x*0x7fff, true);
    }
    return new Blob([ab],{type:'audio/wav'});
  }

  function prerender(kind){
    var OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!OC||!window.Blob||!window.URL||!URL.createObjectURL) return;
    var off;
    try{ off=new OC(1, Math.ceil(44100*DUR[kind]), 44100); }catch(e){ return; }
    try{ VOICE[kind](off,0,off.destination); }catch(e){ return; }
    function done(buf){
      var url;
      try{ url=URL.createObjectURL(wav(buf)); }catch(e){ return; }
      for(var i=0;i<3;i++){
        var el=new Audio(); el.src=url; el.preload='auto';
        try{ el.load(); }catch(e){}
        pool[kind].push(el);
      }
    }
    try{
      var r=off.startRendering();
      if(r&&r.then) r.then(done)['catch'](function(){});
      else off.oncomplete=function(e){ done(e.renderedBuffer); };
    }catch(e){}
  }
  prerender('red'); prerender('yellow');

  /* ---------- lecture ---------- */
  function ctx(){
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    if(!ac){ try{ ac=new C(); }catch(e){ return null; } }
    if(ac.state==='suspended'&&ac.resume) ac.resume();
    return ac;
  }
  function live(kind){
    var a=ctx(); if(!a) return;
    try{ VOICE[kind](a,a.currentTime,a.destination); }catch(e){}
  }
  function warn(){
    if(warned) return; warned=true;
    hint.textContent='Son bloqué : vérifie le bouton silence sur le côté du téléphone.';
  }
  function play(kind){
    var list=pool[kind];
    if(list.length){
      var el=list[turn[kind]++ % list.length];
      try{ el.currentTime=0; }catch(e){}
      try{
        var pr=el.play();
        if(pr&&pr['catch']) pr['catch'](function(){ live(kind); warn(); });
        return;
      }catch(e){}
    }
    live(kind);
  }
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden&&ac&&ac.state==='suspended'&&ac.resume) ac.resume();
  });

  /* ---------- interactions ---------- */
  function setTeam(t){
    team=t;
    body.className=t;
    teams.forEach(function(b){ b.setAttribute('aria-checked', b.dataset.t===t ? 'true':'false'); });
    if(tint) tint.setAttribute('content',TINT[t]);
    try{ localStorage.setItem('buzzer.team',t); }catch(e){}
  }
  function fire(){
    play(team);
    if(navigator.vibrate){ try{ navigator.vibrate(team==='red'?[45,25,45]:35); }catch(e){} }
    ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
    count++;
    if(!warned) hint.innerHTML='<b>'+NAME[team]+'</b> a buzzé — '+count+' fois';
  }
  function press(){ buzz.classList.add('down'); fire(); }
  function release(){ buzz.classList.remove('down'); }

  buzz.addEventListener('pointerdown', function(e){ e.preventDefault(); buzz.focus(); press(); });
  buzz.addEventListener('pointerup', release);
  buzz.addEventListener('pointercancel', release);
  buzz.addEventListener('pointerleave', release);
  buzz.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  teams.forEach(function(b){
    b.addEventListener('click', function(){ setTeam(b.dataset.t); });
  });

  addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); press(); }
    else if(e.key==='ArrowLeft') setTeam('red');
    else if(e.key==='ArrowRight') setTeam('yellow');
  });
  addEventListener('keyup', function(e){
    if(e.key===' '||e.key==='Enter') release();
  });

  try{
    var saved=localStorage.getItem('buzzer.team');
    if(saved==='red'||saved==='yellow') setTeam(saved);
  }catch(e){}
})();
</script>
</body>
</html>
